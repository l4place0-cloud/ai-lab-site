name: Build and deploy site

on:
  push:
    branches: [main]
  # The content repository sends this event when it changes, so the site
  # rebuilds without polling. See tools/notify-site.ps1 in the content repo.
  repository_dispatch:
    types: [content-updated]
  # Allows a manual rebuild from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The content repo is ~12 GB, almost all of it Git LFS media that the
      # site never renders. Fetch only manifest.json plus the covers and demo
      # entries the build actually reads; see src/fetch-content.mjs.
      - name: Mirror the content repository
        env:
          CONTENT_REPO_SLUG: l4place0/ai-lab
          CONTENT_REF: main
          GITHUB_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}
        run: node src/fetch-content.mjs --out content

      - name: Copy covers and embeddable demos
        env:
          CONTENT_REPO: ${{ github.workspace }}/content
        run: node src/covers.mjs

      - name: Build site
        env:
          CONTENT_REPO: ${{ github.workspace }}/content
        run: node src/build.mjs

      - name: Verify the build produced a site
        run: |
          test -f public/index.html || { echo "public/index.html missing"; exit 1; }
          pages=$(find public/p -name '*.html' 2>/dev/null | wc -l)
          echo "detail pages: $pages"
          test "$pages" -gt 0 || { echo "no detail pages were generated"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
